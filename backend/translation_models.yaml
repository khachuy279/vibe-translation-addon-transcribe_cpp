default_model: index-translate-9b

models:
  index-translate-2b:
    name: Index-Translate-2B (Q8_0)
    model: IndexTeam/Index-Translate-2B-GGUF
    gguf_file: Index-Translate-2B.Q8_0.gguf
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    repetition_penalty: 1.0
    prompt_style: index
    aliases:
      - index-2b
    description: Siêu nhẹ 2B (en/ja/zh/vi..., ~2.2GB Q8_0)

  index-translate-9b:
    name: Index-Translate-9B (Q4_K_M)
    model: IndexTeam/Index-Translate-9B-GGUF
    gguf_file: Index-Translate-9B.Q4_K_M.gguf
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    repetition_penalty: 1.0
    prompt_style: index
    aliases:
      - index-9b
    description: Chất lượng cao 9B (en/ja/zh/vi..., ~5.5GB Q4_K_M)

  translate-gemma-4-sub:
    name: Translate-Gemma-4-Sub (E4B)
    model: 17slever17/translate-gemma-4-sub-e4b-GGUF
    gguf_file: translate_gemma4_sub-E4B-Q4_K_XL.gguf # hoặc bản Quant khác
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    repetition_penalty: 1.0
    prompt_style: gemma-sub
    aliases:
      - gemma-sub
    description: Model chuyên dịch phụ đề ngữ cảnh đời thực (SubWave)

  gemma-4-12b-qat:
    name: Gemma 4 12B IT QAT (UD-Q4_K_XL)
    model: unsloth/gemma-4-12B-it-qat-GGUF
    gguf_file: gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
    temperature: 0.1
    top_p: 0.95
    top_k: 40
    repetition_penalty: 1.1
    prompt_style: gemma-sub
    aliases:
      - gemma-12b
      - gemma-4-12b
      - qat-12b
    description: Gemma 4 12B QAT đa ngữ (~6.7GB UD-Q4_K_XL). Dùng chung prompt Gemma-Sub; cần ~8GB VRAM.