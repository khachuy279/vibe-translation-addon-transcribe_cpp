default_model: qwen3-asr-1.7b
models:
  qwen3-asr-1.7b:
    name: Qwen3 ASR 1.7B (GGUF)
    family: qwen3_asr
    architecture_type: offline_llm
    hf_repo: handy-computer/Qwen3-ASR-1.7B-gguf
    default_quant: Q8_0
    file: Qwen3-ASR-1.7B-Q8_0.gguf
    sample_rate: 16000
    languages: auto
    vram_estimate_mb: 2100
    context_window_sec: 30
    description: Alibaba Audio-LLM model ported to transcribe.cpp, 1.61% WER, auto-detect 30 languages
  qwen3-asr-0.6b:
    name: Qwen3 ASR 0.6B (GGUF)
    family: qwen3_asr
    architecture_type: offline_llm
    hf_repo: handy-computer/Qwen3-ASR-0.6B-gguf
    default_quant: Q8_0
    file: Qwen3-ASR-0.6B-Q8_0.gguf
    sample_rate: 16000
    languages: auto
    vram_estimate_mb: 2100
    context_window_sec: 30
    description: Alibaba Audio-LLM model ported to transcribe.cpp, 1.61% WER, auto-detect 30 languages
  sensevoice-small:
    name: SenseVoice Small (GGUF)
    family: sensevoice
    architecture_type: non_autoregressive
    hf_repo: handy-computer/SenseVoiceSmall-gguf
    default_quant: F32
    file: SenseVoiceSmall-F32.gguf
    sample_rate: 16000
    languages:
    - zh
    - en
    - ja
    - ko
    - yue
    vram_estimate_mb: 500
    description: Non-autoregressive speech model via transcribe.cpp, latency ~20ms
  nemotron-3.5-streaming:
    name: Nemotron 3.5 ASR Streaming (GGUF)
    family: nemotron
    att_context_right: 1 # lookahead 80ms
    architecture_type: streaming
    hf_repo: handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf
    default_quant: F16
    file: nemotron-3.5-asr-streaming-0.6b-F16.gguf
    sample_rate: 16000
    languages: auto
    vram_estimate_mb: 750
    description: NVIDIA Multilingual streaming ASR model ported to transcribe.cpp
  cohere-transcribe:
    name: Cohere Transcribe 03-2026 (Q8_0)
    family: cohere_transcribe
    architecture_type: offline_llm
    hf_repo: handy-computer/cohere-transcribe-03-2026-gguf
    default_quant: Q8_0
    file: cohere-transcribe-03-2026-Q8_0.gguf
    sample_rate: 16000
    languages: auto
    vram_estimate_mb: 2200
    context_window_sec: 30
    description: CohereLabs multilingual ASR model ported to transcribe.cpp, 1.27% WER
  voxtral-mini-4b-realtime:
    name: Voxtral Mini 4B Realtime (Q5_K_M)
    family: voxtral
    num_delay_tokens: 2          # --stream-voxtral-delay 2 = 160ms delay
    min_decode_interval_ms: 100
    architecture_type: streaming
    hf_repo: handy-computer/Voxtral-Mini-4B-Realtime-2602-gguf
    default_quant: Q5_K_M
    file: Voxtral-Mini-4B-Realtime-2602-Q5_K_M.gguf
    sample_rate: 16000
    languages: auto
    vram_estimate_mb: 3200
    description: Mistral Voxtral Mini 4B Realtime Audio-LLM streaming ASR model ported to transcribe.cpp
  whisper-large-v3-turbo:
    name: whisper-large-v3-turbo (Q8_0)
    family: whisper
    architecture_type: offline_llm
    hf_repo: handy-computer/whisper-large-v3-turbo-gguf
    default_quant: Q8_0
    file: whisper-large-v3-turbo-Q8_0.gguf
    sample_rate: 16000
    languages: auto
    vram_estimate_mb: 1500
    context_window_sec: 30
    description: Whisper large v3 turbo ASR model ported to transcribe.cpp